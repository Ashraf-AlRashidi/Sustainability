<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <title>Climate Change & Sustainability | البشمهندس أشروووف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- هيدر مدمج ونظيف جداً (لا يأخذ مساحة من شاشة الموبايل) -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <span class="brand-dot"></span>
        <span class="brand-title">Climate Change</span>
        <span class="brand-sep">|</span>
        <span id="dev-badge-text" class="brand-dev">البشمهندس أشروووف</span>
      </div>

      <div class="topbar-end">
        <span id="top-contact-label" class="dua-pill">أسألكم دعوة حلوة من القلب ❤️</span>
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="تبديل المظهر">
          <span id="theme-icon">☀️</span>
        </button>
      </div>
    </div>

    <!-- شريط الأقسام الرئيسية (يظهر على الكمبيوتر، وعلى الموبايل ينزل تحت كشريط تطبيق ثابت) -->
    <nav class="desktop-nav" aria-label="أقسام الموقع">
      <button class="main-nav-btn active" data-section="section-summaries" type="button">📚 التلخيصات</button>
      <button class="main-nav-btn" data-section="section-last-exam" type="button">📄 امتحان السنة اللي فاتت</button>
      <button class="main-nav-btn" data-section="section-basmaga" type="button">⚡ البصمجة</button>
      <button class="main-nav-btn" data-section="section-full-exam" type="button">🎯 اختبر نفسك (200 سؤال)</button>
    </nav>
  </header>

  <!-- المحتوى الرئيسي يبدأ فوراً بدون أي فواصل أو بانرات تضيع مساحة الشاشة -->
  <main class="app-main">

    <!-- 1. قسم التلخيصات -->
    <section id="section-summaries" class="main-section active">
      <!-- شريط التحكم المدمج (اختيار الأسبوع + الـ 4 أقسام الفرعية في مساحة مدمجة جداً) -->
      <div class="sticky-controls">
        <!-- اختيار الأسبوع في سطر واحد فقط -->
        <div id="summaries-list-container" class="weeks-bar"></div>

        <!-- الـ 4 أقسام الفرعية في سطر واحد أنيق -->
        <div class="sub-tabs-bar" role="tablist">
          <button class="sub-tab-btn active" data-subtab="sub-summary" type="button">📖 التلخيص</button>
          <button class="sub-tab-btn" data-subtab="sub-practice" type="button">✍️ الحل</button>
          <button class="sub-tab-btn" data-subtab="sub-past" type="button">🗂️ سنين سابقة</button>
          <button class="sub-tab-btn" data-subtab="sub-quiz" type="button">🎯 اختبر نفسك</button>
        </div>
      </div>

      <!-- عنوان الأسبوع المختار في سطر مدمج شيك -->
      <div class="active-week-strip">
        <span id="active-summary-badge" class="week-tag">Week 1</span>
        <h1 id="active-summary-title" class="week-heading">أهداف التنمية المستدامة (SDGs)</h1>
      </div>

      <!-- اللوحات الـ 4 -->
      <div id="sub-summary" class="sub-panel active"></div>
      <div id="sub-practice" class="sub-panel"></div>
      <div id="sub-past" class="sub-panel"></div>
      <div id="sub-quiz" class="sub-panel"></div>
    </section>

    <!-- 2. قسم امتحان السنة اللي فاتت -->
    <section id="section-last-exam" class="main-section">
      <div id="last-exam-container"></div>
    </section>

    <!-- 3. قسم البصمجة -->
    <section id="section-basmaga" class="main-section">
      <div id="basmaga-container"></div>
    </section>

    <!-- 4. قسم اختبر نفسك (200 سؤال) -->
    <section id="section-full-exam" class="main-section">
      <div id="full-exam-container"></div>
    </section>

  </main>

  <!-- شريط الموبايل السفلي (4 أقسام واضحة بضغطة واحدة) -->
  <nav class="mobile-dock" aria-label="التنقل السريع">
    <button class="dock-item active" data-section="section-summaries" type="button">
      <span class="dock-ic">📚</span>
      <span class="dock-lbl">التلخيصات</span>
    </button>
    <button class="dock-item" data-section="section-last-exam" type="button">
      <span class="dock-ic">📄</span>
      <span class="dock-lbl">امتحان سابق</span>
    </button>
    <button class="dock-item" data-section="section-basmaga" type="button">
      <span class="dock-ic">⚡</span>
      <span class="dock-lbl">البصمجة</span>
    </button>
    <button class="dock-item" data-section="section-full-exam" type="button">
      <span class="dock-ic">🎯</span>
      <span class="dock-lbl">اختبر نفسك</span>
    </button>
  </nav>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
